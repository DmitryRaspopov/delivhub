services:
  # POSTGRESQL
  postgres:
    image: postgres:15-alpine
    container_name: delivhub-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      CUSTOMER_DB_USER: ${CUSTOMER_DB_USER}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD}
      ORDER_DB_USER: ${ORDER_DB_USER}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      STORE_DB_USER: ${STORE_DB_USER}
      STORE_DB_PASSWORD: ${STORE_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh
    networks:
      - delivhub-network

  # REDIS
  redis:
    image: redis:7-alpine
    container_name: delivhub-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    networks:
      - delivhub-network

  # KAFKA
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: delivhub-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - delivhub-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: delivhub-kafka
    restart: "no"
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT}:9092"
    entrypoint: ["sh", "-c", "sleep 5 && /etc/confluent/docker/run"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 3000
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 3000
    networks:
      - delivhub-network

volumes:
  pgdata:
  redisdata:

networks:
  delivhub-network:
    driver: bridge